name: CyberTrace-Graph CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        # Install all microservice requirements
        find . -name "requirements.txt" -exec pip install -r {} \;
        # Install additional dependencies that might be missing from partial requirements
        pip install httpx python-dateutil

    - name: Run Pytest Suite
      env:
        PYTHONPATH: .
      run: |
        pytest tests/test_detectors.py tests/test_rules.py tests/test_ingestion.py tests/test_soar.py -v --tb=short
