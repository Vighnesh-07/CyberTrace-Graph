processor:
  group_id: "cybertrace-processor-01"
  log_level: "INFO"
  stats_interval: 500  # Log stats every N events

kafka:
  bootstrap_servers: "localhost:9092"
  client_id: "stream-processor-01"
  compression_type: "lz4"
  batch_size: 16384
  linger_ms: 100
  acks: "all"

input_topics:
  - "apt.events.dns"
  - "apt.events.network"
  - "apt.events.endpoint"
  - "apt.events.auth"

output_topics:
  alerts: "apt.alerts.raw"
  enriched: "apt.events.enriched"

detectors:
  beaconing:
    window_seconds: 300
    min_samples: 5
    cv_threshold: 0.3
  dns_anomaly:
    window_seconds: 300
    max_unique_domains: 100
    max_query_rate: 200
    txt_ratio_threshold: 0.3
    nxdomain_ratio_threshold: 0.5
